[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bybit_p2p"
version = "1.3.1"
authors = [
  { name="Nickolay Kushnarenko", email="nickolay.kushnarenko@bybit.com" },
]
description = "Deprecated: use pybit for Bybit API integrations."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "requests",
  "requests_toolbelt",
  "pycryptodome"
]

[project.urls]
Homepage = "https://github.com/bybit-exchange/bybit_p2p"
Issues = "https://github.com/bybit-exchange/bybit_p2p/issues"
Migration = "https://pypi.org/project/pybit/"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
